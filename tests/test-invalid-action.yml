name: Test invalid action verb
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: not-a-real-verb
          app_location: tests/fixtures/app
          azure_static_web_apps_api_token: invalid-test-deployment-token
      - name: Assert no URL produced for invalid verb
        env:
          RESULT: ${{ steps.action.outputs.static_web_app_url }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: invalid verb should not produce a URL"
            exit 1
          fi
          echo "PASS"
