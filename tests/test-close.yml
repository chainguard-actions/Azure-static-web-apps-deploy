name: Test close action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Closing a PR environment requires a real Azure deployment token, which is not
      # available in the harness; accept a graceful failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: close
          app_location: tests/fixtures/app
          azure_static_web_apps_api_token: invalid-test-deployment-token
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed (outcome '$OUTCOME')"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
